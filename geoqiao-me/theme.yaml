# geoqiao.me — a Chinese-first personal writer Theme for escaping (Theme API 4).
# Set options under theme.options in config.yaml; see README.md.
api: 4

options:
  author_mark:
    type: url
    default: ""
    description: >-
      Image shown next to the byline on posts and beside the About heading.
      Empty uses profile.avatar, or the bundled GQ mark when the site has no avatar.
  favicon:
    type: url
    default: ""
    description: >-
      Browser icon, also the preview image when seo.social_image is empty.
      Empty uses the bundled GQ mark.
  blog_intro:
    type: string
    default: ""
    description: The line under the Blog heading; empty uses the Theme's own text.
  show_powered_by:
    type: boolean
    default: true
    description: Show the "Source" link in the footer.
  powered_by_url:
    type: url
    default: https://github.com/geoqiao/escaping
    description: Where the footer "Source" link points.
  comments_theme:
    type: choice
    values: [github-light, github-dark, preferred-color-scheme, github-dark-orange, icy-dark, dark-blue, photon-dark, boxy-light, gruvbox-dark]
    default: github-light
    description: Utterances color theme used when comments_theme_mode is fixed.
  comments_theme_mode:
    type: choice
    values: [auto, fixed]
    default: auto
    description: auto follows the light/dark choice; fixed always uses comments_theme.

