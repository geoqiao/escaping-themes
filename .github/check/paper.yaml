# Checks paper/ in .github/workflows/check.yml.
github:
  repo: alice/site
  allowed_authors:
  - alice
site:
  title: Alice's notes
  author: Alice
  url: https://example.github.io/
  description: Notes on tools and code.
  language: en
  navigation:
    items:
    - name: Home
      url: /
    - name: Blog
      url: /blog/
    - name: Ideas
      url: /ideas/
