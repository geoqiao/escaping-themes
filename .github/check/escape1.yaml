# Checks escape1/ in .github/workflows/check.yml.
github:
  repo: alice/site
  allowed_authors:
  - alice
site:
  title: Alice's notes
  author: Alice
  url: https://example.github.io/
  description: Notes on tools and code.
  language: en
profile:
  avatar: /assets/images/favicon.png
  bio: I build small tools.
  links:
  - name: GitHub
    url: https://github.com/alice
  - name: Email
    url: mailto:alice@example.com
pages:
  ideas: true
  tags: true
  projects: true
  about: true
redirects:
  /2020/old-post.html: /blog/hello-world/
  /about.html: /about/
theme:
  use: ./theme
comments:
  enabled: true
  repo: alice/site
paths:
  page_size: 2
projects:
- repository: alice/tool
  title: Tool
  summary: A small utility maintained alongside these notes.
  featured: true
  order: 1
  fallback_metadata:
    stars: 18
    forks: 3
    language: Python
- website: https://notebook.example/
  slug: notebook
  title: Notebook
  summary: A standalone web project without a source repository.
  order: 2
